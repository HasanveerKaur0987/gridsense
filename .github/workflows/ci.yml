name: Tests

on:
  push:              # run on every push
  pull_request:      # also run when a pull request is opened

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5          # download your code
      - uses: actions/setup-python@v6      # install Python
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest -v
        